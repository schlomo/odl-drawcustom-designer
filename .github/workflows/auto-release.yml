# Release pipeline — every push to main (issue #93; npm publishing #103; npm
# Trusted Publishing 2026-08-16; unified with the production Pages deploy and
# de-raced 2026-09-01 per maintainer ruling).
#
# main is always stable (PR `checks` in pages.yml gate it), so every push to
# main is a release — at least a patch, always (tools/releaseVersion.ts).
#
# SHAPE — one computation, then a fan-out:
#
#     version  ── computes the version ONCE and creates the tag + release
#        ├── npm    ── publishes that version to npm
#        └── pages  ── builds and deploys the standalone site at that version
#
# `npm` and `pages` both consume `needs.version.outputs.version` and NEITHER
# depends on the other, so they run in parallel and either can fail without
# demoting the other (maintainer ruling: "each has its own value and a
# failure doesn't demote the other"). Both bake the SAME version, which by
# then is a published fact, not a prediction — this replaces the old
# arrangement where pages.yml's `production` job raced this workflow and had
# to re-derive the version auto-release was about to publish
# (tools/siteVersion.ts, deleted). Recovery is per-job: "Re-run failed jobs"
# re-runs only the failed publish against the same version, and both publish
# steps are idempotent. See docs/releasing.md#failure-and-recovery.
#
# DO NOT RENAME THIS FILE. npm Trusted Publishing is configured on npmjs.com
# against the workflow FILENAME `auto-release.yml` (docs/releasing.md#npm);
# renaming it breaks publishing until the maintainer updates that setting.
#
# `workflow_dispatch` runs the exact same path against the current main. With
# nothing new to release the `version` job reports the existing tag's version
# and creates no release, while both publish jobs still run and reconcile —
# that is the manual recovery trigger.
#
# Thin CI (AGENTS.md): all decision logic (bump derivation/precedence, tag
# ancestry, the first-release case, release-asset generation, npm staging,
# the NPM_PUBLISH gate, the already-published check) lives in tools/ and is
# unit-tested under tests/tools/. This file only wires checkout/Node/npm,
# passes one job's outputs to the next, and calls the scripts.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize: each run derives "the next version" from tag ancestry, so
# overlapping runs on rapid consecutive pushes must queue, never race or
# cancel a half-published release.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 1. The version — computed once, up front, and the tag/release created
  #    here so both publish jobs downstream consume a fact.
  # ---------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` (which creates the tag too).
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      create-release: ${{ steps.version.outputs.create-release }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: tools/releaseVersion.ts needs every vX.Y.Z
          # tag reachable from HEAD and the full commit log since the latest
          # one. This is the ONLY job that needs it — the publish jobs just
          # build, so they keep the default shallow checkout.
          fetch-depth: 0
          # Blobless: fetch every commit and tree, but download a historical
          # file's CONTENTS only when something actually asks for one.
          # Nothing in this job does — `git tag --list --merged HEAD` and
          # `git log --format=%B` read refs and commit objects; the gate and
          # the library build read the checked-out working tree (whose blobs
          # actions/checkout downloads regardless); `gh release create` talks
          # to the API and uploads locally built files. So what this saves is
          # the HISTORY of file contents, not the working tree: on this repo
          # a full clone's object store measures ~224 MB against ~4 MB
          # blobless, while the checked-out tree costs the same ~7 MB either
          # way.
          #
          # DO NOT COPY THIS TO THE `pages` JOB. PR #174 put `filter:
          # blob:none` on the old production job and BROKE PRODUCTION
          # DEPLOYS: JamesIves/github-pages-deploy-action runs its own
          # `git fetch --no-recurse-submodules --depth=1 origin gh-pages`
          # inside that same checkout to build its deploy worktree, and a
          # promisor (partial) clone cannot satisfy it —
          #   fatal: missing blob object '871af9f8af779d0ec4cb6cc7c44f023aab620395'
          #   error: remote did not send all necessary objects
          #   ##[error]The cwd: .../github-pages-deploy-action-temp-deployment-folder does not exist!
          # (run 33432789880: steps 1-9 all green, only `Deploy production`
          # failed — the site silently stopped deploying while every PR check
          # stayed green). Reverted in PR #176. The filter is usable again
          # ONLY because this restructure moved the deploy into a separate
          # job: this one never runs that action.
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The release gate. It runs once, here, before anything irreversible —
      # both publish jobs `needs: version`, so neither can publish past a red
      # gate. (PR `checks` in pages.yml already gated this commit as a PR;
      # this re-runs it against main itself.)
      - run: npm test
      - run: npm run lint

      # Ruling 1: compute the version ONCE. Everything downstream reads this
      # step's outputs; nothing recomputes it. Runs identically on a laptop —
      # `node tools/releaseVersion.ts` prints the same decision.
      - name: Compute the release version
        id: version
        run: node tools/releaseVersion.ts

      # Builds the library at that version, generates THIRD_PARTY.md and the
      # sha256 files, and creates the tag + GitHub release — unless the
      # version is already released (a workflow_dispatch, or a re-run), in
      # which case it builds the same artifacts and creates nothing.
      - name: Build the library and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          CREATE_RELEASE: ${{ steps.version.outputs.create-release }}
        run: node tools/createRelease.ts

  # ---------------------------------------------------------------------
  # 2a. npm — parallel with `pages`, independent of it.
  # ---------------------------------------------------------------------
  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm Trusted Publishing / provenance (issue #103): `npm publish`
      # exchanges this workflow's OIDC token for a short-lived npm
      # credential — no long-lived npm token anywhere. Harmless when
      # NPM_PUBLISH is not enabled; tools/publishNpm.ts skips the publish.
      id-token: write
    steps:
      # Shallow: this job never reads tags or history, only LICENSE, NOTICE,
      # README.md and the tools/ scripts that stage the package.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          # Trusted Publishing needs no auth token in .npmrc (no
          # NODE_AUTH_TOKEN) — the OIDC exchange targets this registry by
          # URL, which is all registry-url wires here.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Trusted Publishing requires npm CLI >= 11.5.1
      # (docs.npmjs.com/trusted-publishers) and Node >= 22.14.0; the runner's
      # Node-bundled npm is not guaranteed to clear that floor. Pinned to a
      # known-good minor (not @latest) so a future npm release cannot
      # silently change publish behavior — bump deliberately.
      - run: npm install -g npm@11.19

      # tools/publishNpm.ts fetches the release's own assets (`gh release
      # download`) and publishes exactly those bytes, so the release's
      # .sha256 assets describe the npm tarball too. Deliberately NOT an
      # upload-artifact/download-artifact hand-off from the `version` job:
      # artifacts are scoped to a workflow run and their visibility across
      # run ATTEMPTS is not pinned down by the action's docs, while
      # "Re-run failed jobs" on this job alone — attempt 2 running `npm`
      # while `version` stays green from attempt 1 — is exactly this
      # pipeline's headline recovery path. The release is authoritative,
      # complete by the time this runs (tools/createRelease.ts reconciles
      # it), and outlives artifact retention.
      - name: Publish to npm
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          # Staged rollout gate (issue #103): a repo **variable**, not a
          # secret — there is no token to manage under Trusted Publishing.
          # Anything other than "enabled" means the maintainer hasn't
          # configured a trusted publisher for this repo/workflow on
          # npmjs.com; tools/publishNpm.ts then skips with a prominent
          # job-summary warning and the release/site stand unaffected.
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: node tools/publishNpm.ts

  # ---------------------------------------------------------------------
  # 2b. GitHub Pages production — parallel with `npm`, independent of it.
  # ---------------------------------------------------------------------
  pages:
    needs: version
    runs-on: ubuntu-latest
    # Serialize ALL pushes to gh-pages, shared with pages.yml's `preview`
    # job (concurrency groups are repository-wide): when two deploys land on
    # gh-pages within seconds, GitHub's legacy Pages build of the first
    # commit gets superseded mid-build and reports "Page build failed".
    # Queuing (cancel-in-progress: false) instead of cancelling means no
    # deploy is ever lost. Do not remove or rename this group.
    concurrency:
      group: gh-pages-push
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      VITE_HEADER_LEGAL_HTML: ${{ vars.VITE_HEADER_LEGAL_HTML || '' }}
    steps:
      # Shallow: the version arrives as a job output, so this job needs no
      # tags and no history (the old `production` job needed fetch-depth: 0
      # only to re-derive the version itself).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # build:site = app build (dist/) + library build (dist-lib/) + embed
      # demo assembly into dist/embed/ (tools/assembleSite.ts, issue #69).
      # APP_VERSION is the version the release above published — the header
      # labels the site with it (src/core/buildInfo.ts's APP_HEADER_VERSION).
      # lint/test are NOT repeated here: the `version` job gated this commit
      # and this job `needs:` it.
      - run: npm run build:site
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}

      # Diagnostic snapshot; nothing downloads it. `overwrite: true` because
      # the artifact name is keyed on the RUN number, which "Re-run failed
      # jobs" reuses: on the observed evidence uploads are scoped per run
      # ATTEMPT and a re-run does not conflict (PR #183's own preview job
      # re-ran with overwrite:false and uploaded the same name again), but
      # this step sits BEFORE the deploy, so if that ever changed a conflict
      # here would block the deploy from being retried at all. Overwriting
      # also keeps the newest attempt as the one snapshot, instead of
      # accumulating same-named duplicates.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-production-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Deploy production
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
          clean-exclude: pr-preview
          force: false
