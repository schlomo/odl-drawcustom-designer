# Auto-release on push to main (issue #93, reworked 2026-07-29 per
# maintainer ruling: KISS, long-term, no PAT; extended for issue #103 with
# npm publishing + sha256/NOTICE/THIRD_PARTY.md release assets). main is
# always stable (PR checks gate it), so every push to main is a release
# candidate. This is the single release mechanism: it derives a semver bump
# from conventional-commit titles since the last `vX.Y.Z` tag reachable from
# HEAD, builds the library with that version injected, and publishes it as a
# GitHub release — `gh release create` creates the tag itself. Nothing is
# ever pushed to main (no bump commit, no package.json write), so the default
# `GITHUB_TOKEN` suffices — no downstream workflow needs to trigger off the
# tag, so there is no loop-prevention problem to work around and no PAT is
# needed.
#
# `workflow_dispatch` is a manual fallback that runs the exact same path —
# useful to trigger a release check without waiting for the next push. Note
# that a stranded `npm publish` failure (release already created, publish
# itself failed) self-heals on ANY subsequent run, including an ordinary
# push — tools/autoRelease.ts's skip path checks the npm registry and
# recovers it automatically (docs/releasing.md#partial-failure-recovery);
# workflow_dispatch just lets you force that check immediately instead of
# waiting. See docs/releasing.md.
#
# Thin CI (AGENTS.md): all decision logic (bump derivation/precedence, tag
# ancestry, the no-tag-yet case, release-asset generation, npm staging, the
# NPM_TOKEN-absent skip, partial-failure npm-publish recovery) lives in
# tools/autoRelease.ts and the tools/ modules it calls, unit-tested under
# tests/tools/. This file only wires checkout/Node/npm, npm registry auth,
# and the `id-token: write` permission `npm publish --provenance` needs,
# then calls the script.

name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize: each run derives "the next version" from tag ancestry, so
# overlapping runs on rapid consecutive pushes must queue, never race or
# cancel a half-published release.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write
  # npm provenance (issue #103): `npm publish --provenance` needs an OIDC
  # token to attest the package was built by this workflow. Harmless when
  # NPM_TOKEN is absent — tools/autoRelease.ts skips the publish step
  # entirely in that case, this permission is just unused.
  id-token: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: tools/autoRelease.ts needs every tag
          # reachable from HEAD and the full commit log since the latest one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          # Writes ~/.npmrc with the registry.npmjs.org auth line referencing
          # ${NODE_AUTH_TOKEN} — harmless when the Release step below has no
          # NODE_AUTH_TOKEN set (tools/autoRelease.ts checks NPM_TOKEN itself
          # and skips `npm publish` entirely; nothing ever reads this .npmrc
          # in that case).
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          # NPM_TOKEN does not exist as a repository secret yet (issue #103,
          # deliberate staged rollout) — until the maintainer adds it,
          # `secrets.NPM_TOKEN` resolves empty, tools/autoRelease.ts detects
          # that and skips npm publish with a prominent job-summary warning,
          # and the GitHub release still completes normally. See
          # docs/releasing.md#npm.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # What `npm publish` itself actually authenticates with — the
          # ~/.npmrc setup-node wrote above reads this exact variable name.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node tools/autoRelease.ts
