# Auto-release on push to main (issue #93, reworked 2026-07-29 per
# maintainer ruling: KISS, long-term, no PAT). main is always stable (PR
# checks gate it), so every push to main is a release candidate. This is the
# single release mechanism: it derives a semver bump from conventional-
# commit titles since the last `vX.Y.Z` tag reachable from HEAD, builds the
# library with that version injected, and publishes it as a GitHub release —
# `gh release create` creates the tag itself. Nothing is ever pushed to
# main (no bump commit, no package.json write), so the default
# `GITHUB_TOKEN` suffices — no downstream workflow needs to trigger off the
# tag, so there is no loop-prevention problem to work around and no PAT is
# needed.
#
# `workflow_dispatch` is a manual fallback that runs the exact same path —
# useful for a clean retry after a transient failure (npm/GitHub outage,
# etc). See docs/releasing.md.
#
# Thin CI (AGENTS.md): all decision logic (bump derivation/precedence, tag
# ancestry, the no-tag-yet case) lives in tools/autoRelease.ts, unit-tested
# in tests/tools/autoRelease.test.ts. This file only wires checkout/Node/npm
# and calls the script.

name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize: each run derives "the next version" from tag ancestry, so
# overlapping runs on rapid consecutive pushes must queue, never race or
# cancel a half-published release.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: tools/autoRelease.ts needs every tag
          # reachable from HEAD and the full commit log since the latest one.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/autoRelease.ts
